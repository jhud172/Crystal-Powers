plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.crystalpower'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('installFrontend', Exec) {
    workingDir file('frontend')
    commandLine npmCommand, 'ci'
    onlyIf {
        !providers.environmentVariable('SKIP_FRONTEND_BUILD').present
    }
}

tasks.register('buildFrontend', Exec) {
    dependsOn tasks.named('installFrontend')
    workingDir file('frontend')
    commandLine npmCommand, 'run', 'build'
    onlyIf {
        !providers.environmentVariable('SKIP_FRONTEND_BUILD').present
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('buildFrontend')
    from('frontend/dist') {
        into 'static'
    }
}

tasks.named('bootRun') {
    def bootRunPort = providers.gradleProperty('bootRunPort')
            .orElse(providers.environmentVariable('BOOTRUN_PORT'))
            .orElse('8080')

    systemProperty 'server.port', bootRunPort.get()
}

tasks.named('test') {
    useJUnitPlatform()
}
