plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.crystalproduction'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('buildFrontendCss', Exec) {
    commandLine npmCommand, 'run', 'build:css'
    // Docker builds precompile CSS in the dedicated Node stage.
    onlyIf {
        !providers.environmentVariable('SKIP_FRONTEND_BUILD').present
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('buildFrontendCss')
}

tasks.named('test') {
    useJUnitPlatform()
}
