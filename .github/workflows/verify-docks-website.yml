name: Verify Docks website release candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  website-candidate:
    if: startsWith(github.head_ref, 'James/docks-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crystal_rebuild_test_docks
          POSTGRES_USER: crystal_ci
          POSTGRES_PASSWORD: disposable-ci-database
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U crystal_ci -d crystal_rebuild_test_docks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test the pull request merge candidate
        shell: bash
        run: |
          git log -1 --format='Testing merge commit %H'
          bash ./gradlew --no-daemon test bootJar
      - name: Verify the customer journey on PostgreSQL
        env:
          PG_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55447/crystal_rebuild_test_docks
          PG_TEST_DATABASE_USERNAME: crystal_ci
          PG_TEST_DATABASE_PASSWORD: disposable-ci-database
          SKIP_FRONTEND_BUILD: '1'
        run: bash ./gradlew --no-daemon postgresTest --tests '*DocksCustomerJourneyTests'
      - name: Verify the packaged production-profile routes
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: jdbc:postgresql://127.0.0.1:55447/crystal_rebuild_test_docks_routes
          DATABASE_USERNAME: crystal_ci
          DATABASE_PASSWORD: disposable-ci-database
          PUBLIC_URL: http://127.0.0.1:18084
          MAIL_PROVIDER: disabled
          MEDIA_PROVIDER: local
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U crystal_ci crystal_rebuild_test_docks_routes
          export APP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          java -jar build/libs/crystal-power-website-2.0.0.jar --server.address=127.0.0.1 --server.port=18084 > "$RUNNER_TEMP/docks-website.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true' EXIT
          for attempt in {1..45}; do
            if curl --silent --fail --max-time 2 "$PUBLIC_URL/api/health" >/dev/null; then
              pwsh -NoProfile -File scripts/verify-docks-public-routes.ps1 -Target Candidate
              exit
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          tail -n 65 "$RUNNER_TEMP/docks-website.log"
          exit 1
