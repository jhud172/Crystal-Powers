spring.application.name=crystal-power-website
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_FILE_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_UPLOAD_SIZE:15MB}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

app.mail.to=${APP_MAIL_TO:jhud172@gmail.com}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}
