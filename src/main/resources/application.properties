spring.application.name=crystal-power-website
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_FILE_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_UPLOAD_SIZE:15MB}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

app.mail.to=${APP_MAIL_TO:jhud172@gmail.com}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}
app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.resend-key=${RESEND_API_KEY:}

# Production must supply PostgreSQL explicitly. Use --spring.profiles.active=local for local development.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
app.owner.setup-token=${OWNER_SETUP_TOKEN:}
app.security.encryption-key=${APP_ENCRYPTION_KEY:}
app.media.directory=${MEDIA_DIRECTORY:./.codex-runtime/media}
app.media.provider=${MEDIA_PROVIDER:supabase}
app.media.supabase-url=${SUPABASE_URL:}
app.media.supabase-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.media.bucket=${SUPABASE_MEDIA_BUCKET:project-media}
app.public-url=${PUBLIC_URL:http://localhost:8080}

spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.tomcat.threads.max=40
server.tomcat.max-connections=200
