spring.application.name=crystal-power-website
server.port=${PORT:8080}
# Compress compiled assets only; private/dynamic HTML, JSON and uploaded media are excluded.
server.compression.enabled=true
server.compression.mime-types=text/css,application/javascript,text/javascript
server.compression.min-response-size=1KB
spring.servlet.multipart.max-file-size=${MAX_FILE_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_UPLOAD_SIZE:16MB}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

app.mail.to=${APP_MAIL_TO:jhud172@gmail.com}
# Optional department destinations; blank values preserve the existing enquiry inbox.
app.mail.support-to=${APP_MAIL_SUPPORT_TO:}
app.mail.sales-to=${APP_MAIL_SALES_TO:}
app.mail.general-to=${APP_MAIL_GENERAL_TO:}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}
app.mail.reply-to=${APP_MAIL_REPLY_TO:${APP_MAIL_FROM:${MAIL_USERNAME:}}}
app.mail.support-reply-to=${APP_MAIL_SUPPORT_REPLY_TO:${app.mail.reply-to}}
app.mail.admin-reply-to=${APP_MAIL_ADMIN_REPLY_TO:${app.mail.reply-to}}
app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.resend-key=${RESEND_API_KEY:}

# Production must supply PostgreSQL explicitly. Use --spring.profiles.active=local for local development.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
app.owner.setup-token=${OWNER_SETUP_TOKEN:}
app.security.encryption-key=${APP_ENCRYPTION_KEY:}
app.media.directory=${MEDIA_DIRECTORY:./.codex-runtime/media}
app.media.provider=${MEDIA_PROVIDER:supabase}
app.media.supabase-url=${SUPABASE_URL:}
app.media.supabase-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.media.bucket=${SUPABASE_MEDIA_BUCKET:project-media}
app.public-url=${PUBLIC_URL:http://localhost:8080}
app.billing.enabled=${BILLING_ENABLED:false}
app.billing.live-mode=${STRIPE_LIVE_MODE:false}
app.billing.stripe-secret=${STRIPE_SECRET_KEY:}
app.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.event-recovery-enabled=${BILLING_EVENT_RECOVERY_ENABLED:false}

spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.tomcat.threads.max=40
server.tomcat.max-connections=200
app.upload-scan.enabled=${UPLOAD_SCAN_ENABLED:false}
app.upload-scan.host=${UPLOAD_SCAN_HOST:}
app.upload-scan.port=${UPLOAD_SCAN_PORT:3310}
app.billing.invoice-recovery-enabled=${BILLING_INVOICE_RECOVERY_ENABLED:false}

crystal.billing.refunds-enabled=${BILLING_REFUNDS_ENABLED:false}

# Private channel attachments retain separate per-message limits; this caps live workspace bytes.
app.team-upload.max-workspace-bytes=${TEAM_UPLOAD_MAX_WORKSPACE_BYTES:536870912}

# Explicit private invitation delivery; local outgoing email remains disabled.
app.mail.invitation-enabled=${INVITATION_EMAIL_ENABLED:false}

# Publish only operator-approved complete privacy copy.
app.privacy.published=${PRIVACY_PUBLISHED:false}
app.privacy.content-json=${PRIVACY_CONTENT_JSON:}
