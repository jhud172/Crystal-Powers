<th:block xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
    <section class="portfolio-shell">
        <div class="portfolio-hero">
            <div class="portfolio-hero-copy">
                <span class="eyebrow">Project page</span>
                <h1 class="services-hero-title" th:text="${projectTitle}">Project title</h1>
                <p class="services-hero-body" th:text="${projectSummary}">Project summary.</p>
            </div>

            <div class="portfolio-search-shell">
                <p class="field-label">Project details</p>
                <p class="portfolio-dialog-company" th:text="${projectCompany}">Company</p>
                <p class="portfolio-dialog-company" th:text="${projectMeta}">Meta</p>
                <div class="home-command-actions mt-6">
                    <a th:href="@{/portfolio}" class="secondary-button">Back to portfolio</a>
                    <a th:href="@{/contact}" class="primary-button">Start a build</a>
                </div>
            </div>
        </div>

        <section class="home-story-grid">
            <article class="home-card home-story-card">
                <div class="home-section-header">
                    <span class="eyebrow">Overview</span>
                </div>
                <h2 class="home-card-title">What this build focused on.</h2>
                <p class="home-card-copy" th:text="${projectAbout}">About copy.</p>
                <ul class="services-preview-list mt-6">
                    <li th:each="feature : ${projectFeatures}" th:text="${feature}">Feature</li>
                </ul>
            </article>

            <article class="home-card home-portfolio-preview-card">
                <img th:src="@{${projectImage}}" src="/images/project1.png" alt="Project preview" class="portfolio-card-image" />
            </article>
        </section>

        <section class="home-focus-grid">
            <article class="home-card service-preview-card home-focus-card">
                <p class="section-tag">Creation</p>
                <h2 class="home-card-title">How it was made</h2>
                <p class="home-card-copy" th:text="${projectCreation}">Creation copy.</p>
            </article>

            <article class="home-card service-preview-card home-focus-card lg:col-span-2">
                <p class="section-tag">Why it works</p>
                <h2 class="home-card-title">What makes the result strong</h2>
                <p class="home-card-copy" th:text="${projectWhyItWorks}">Why it works copy.</p>
            </article>
        </section>
    </section>
</th:block>

<th:block th:fragment="scripts"></th:block>
</th:block>
