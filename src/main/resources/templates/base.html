<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, pageDescription, pageKey, content, scripts)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} + ' | Crystal Production'">Crystal Production</title>
    <meta name="description" th:content="${pageDescription}" content="Crystal Production builds premium websites, automation, and digital product experiences." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" th:href="@{/favicon.svg}" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
</head>
<body>
<div class="relative isolate min-h-screen overflow-hidden">
    <div class="pointer-events-none absolute inset-0 -z-30 bg-ink"></div>
    <div class="pointer-events-none absolute inset-x-0 top-0 -z-20 h-[32rem] bg-hero-grid opacity-90 blur-3xl"></div>
    <div class="pointer-events-none absolute inset-y-0 right-[-12rem] -z-20 hidden w-[32rem] rounded-full bg-cyan-400/10 blur-3xl lg:block"></div>
    <div class="pointer-events-none absolute inset-x-0 bottom-[-16rem] -z-20 h-[28rem] bg-[radial-gradient(circle_at_bottom,rgba(249,115,22,0.14),transparent_40%)] blur-3xl"></div>

    <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/75 backdrop-blur-xl">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-5 lg:px-10">
            <a th:href="@{/}" class="flex items-center gap-3 text-white">
                <span class="flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/10 font-display text-lg font-semibold">CP</span>
                <span class="font-display text-sm uppercase tracking-[0.34em] text-slate-200">Crystal Production</span>
            </a>

            <button type="button"
                    data-nav-toggle="true"
                    aria-expanded="false"
                    class="inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-semibold uppercase tracking-[0.24em] text-slate-200 md:hidden">
                Menu
            </button>

            <nav class="hidden items-center gap-6 md:flex">
                <a th:href="@{/}" class="nav-link" th:classappend="${pageKey == 'home'} ? ' nav-link-active'">Home</a>
                <a th:href="@{/about}" class="nav-link" th:classappend="${pageKey == 'about'} ? ' nav-link-active'">About</a>
                <a th:href="@{/services}" class="nav-link" th:classappend="${pageKey == 'services'} ? ' nav-link-active'">Services</a>
                <a th:href="@{/products}" class="nav-link" th:classappend="${pageKey == 'products'} ? ' nav-link-active'">Products</a>
                <a th:href="@{/portfolio}" class="nav-link" th:classappend="${pageKey == 'portfolio'} ? ' nav-link-active'">Portfolio</a>
                <a th:href="@{/support}" class="nav-link" th:classappend="${pageKey == 'support'} ? ' nav-link-active'">Support</a>
                <a th:href="@{/contact}" class="secondary-button !px-5 !py-2.5">Contact</a>
            </nav>
        </div>

        <nav data-nav-menu="true" class="hidden border-t border-white/10 bg-slate-950/95 px-6 py-5 md:hidden">
            <div class="flex flex-col gap-4">
                <a th:href="@{/}" class="nav-link" th:classappend="${pageKey == 'home'} ? ' nav-link-active'">Home</a>
                <a th:href="@{/about}" class="nav-link" th:classappend="${pageKey == 'about'} ? ' nav-link-active'">About</a>
                <a th:href="@{/services}" class="nav-link" th:classappend="${pageKey == 'services'} ? ' nav-link-active'">Services</a>
                <a th:href="@{/products}" class="nav-link" th:classappend="${pageKey == 'products'} ? ' nav-link-active'">Products</a>
                <a th:href="@{/portfolio}" class="nav-link" th:classappend="${pageKey == 'portfolio'} ? ' nav-link-active'">Portfolio</a>
                <a th:href="@{/support}" class="nav-link" th:classappend="${pageKey == 'support'} ? ' nav-link-active'">Support</a>
                <a th:href="@{/contact}" class="primary-button">Contact</a>
            </div>
        </nav>
    </header>

    <main class="mx-auto flex w-full max-w-7xl flex-col gap-24 px-6 pb-24 pt-10 lg:px-10 lg:pt-14">
        <th:block th:replace="${content}"></th:block>
    </main>

    <footer class="border-t border-white/10 bg-slate-950/70 backdrop-blur">
        <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 py-8 text-sm text-slate-400 lg:flex-row lg:items-center lg:justify-between lg:px-10">
            <div>
                <p class="font-display text-base text-white">Crystal Production</p>
                <p>Premium digital builds, operational support, and custom delivery for communities and brands.</p>
            </div>
            <div class="flex flex-wrap gap-4 text-xs uppercase tracking-[0.24em]">
                <a th:href="@{/services}" class="transition hover:text-white">Services</a>
                <a th:href="@{/products}" class="transition hover:text-white">Products</a>
                <a th:href="@{/portfolio}" class="transition hover:text-white">Portfolio</a>
                <a th:href="@{/contact}" class="transition hover:text-white">Contact</a>
            </div>
        </div>
    </footer>
</div>

<script defer th:src="@{/js/site.js}" src="/js/site.js"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
