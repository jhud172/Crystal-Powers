spring.datasource.url=jdbc:h2:mem:crystal-tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
server.servlet.session.cookie.secure=false
app.mail.to=test@example.invalid
app.mail.from=studio@example.invalid
# Synthetic test key, never a production credential.
app.security.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.media.provider=local
app.media.directory=./build/test-media

app.public-url=http://localhost:8080
app.mail.provider=disabled

spring.datasource.hikari.maximum-pool-size=3

# Test contexts cannot inherit live provider/scanner/publication activation from the host.
app.billing.enabled=false
app.billing.live-mode=false
app.billing.stripe-secret=
app.billing.stripe-webhook-secret=
app.billing.event-recovery-enabled=false
app.billing.invoice-recovery-enabled=false
crystal.billing.refunds-enabled=false
app.upload-scan.enabled=false
app.upload-scan.host=
app.mail.invitation-enabled=false
app.privacy.published=false
